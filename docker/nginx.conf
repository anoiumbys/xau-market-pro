# XAU Market Pro - Nginx Configuration
# Proxies API to PHP-FPM, WebSockets to Laravel WebSockets, Frontend to Vite

server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.html;  # Only index.html for SPA

    # Docker embedded DNS — re-resolve upstreams tiap 10s
    # Fix 502 "Connection refused" setelah container app/frontend di-recreate (IP berubah)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;
    set $frontend_upstream frontend:3000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # Client max body size
    client_max_body_size 20M;

    # ===== WebSocket Upgrade (disabled - websockets service not running) =====
    # location /ws {
    #     proxy_pass http://websockets:6001;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 86400;
    #     proxy_send_timeout 86400;
    # }

    # ===== API Routes (CORS handled by Laravel, not nginx) =====
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ===== Storage Files =====
    location /storage {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ===== PHP-FPM (only for API/Storage, CORS handled by Laravel) =====
    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    # ===== Frontend (Vite Dev Server) - SPA fallback =====
    location / {
        # Skip directory check, proxy directly to Vite for SPA routing
        try_files $uri @frontend;
    }

    location @frontend {
        # Proxy to Vite dev server for hot reload
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # ===== Static Assets (cache aggressively) =====
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @frontend;
    }

    # Deny access to hidden files
    location ~ /\.(?!well-known) {
        deny all;
    }
}